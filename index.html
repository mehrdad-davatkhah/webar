<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
  </head>
  <body>
    <a-scene>
      <a-cone
        segments-radial="3"
        height="1"
        position="1 2 -7"
        color="#edae49"
        radius-bottom="3"
        radius-top="2"
        animation="property: rotation; to: 0 360 0; dur: 10000; easing: linear; loop: true"
        >
        <a-text 
        value="Hello, World!"
        scale="2 2 2"
        color="red"
        rotation="0 60 0"
        position="2 0 0"
        >
      </a-text>

     <a-cone
        segments-radial="3"
        height="1"
        position="0 1.3 0"
        color="#d1495b"
        radius-bottom="2"
        radius-top="1"
      >
        
       <a-cone
        segments-radial="3"
        height="1"
        position="0 1.3 0"
        color="#00798c"
        radius-bottom="1"
        radius-top="0"
      ></a-cone>
    
      </a-cone>
    
      </a-cone>

    </a-scene>
  </body>
</html>
