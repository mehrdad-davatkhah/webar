<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-cone
        segments-radial="3"
        height="1"
        position="1 2 -7"
        color="#9f7d4f"
        radius-bottom="3"
        radius-top="2"
        animation="property: rotation; to: 0 360 0; dur: 10000; easing: linear; loop: true"
        <a-text color="red" align="left" baseline="center" width="1" position="-0.5 0 0"
          value="Left\nof box\n(even\nwhen\nmulti-\nline)"></a-text>

        >  
        
     <a-cone
        segments-radial="3"
        height="1"
        position="0 1.3 0"
        color="#9f7d4f"
        radius-bottom="2"
        radius-top="1"
      >
        
       <a-cone
        segments-radial="3"
        height="1"
        position="0 1.3 0"
        color="#9f7d4f"
        radius-bottom="1"
        radius-top="0"
      ></a-cone>
    
      </a-cone>
    
      </a-cone>
  
    </a-scene>
  </body>
</html>
