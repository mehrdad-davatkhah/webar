
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: ./qon.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <img id="card" src="op_001.png" />
        <a-asset-item id="avatarModel" src="qon.gltf"></a-asset-item>
      </a-assets>
      <a-entity id="mySoundEntity" geometry="primitive: plane; width: 2; height: 2" material="color: blue" sound="src: url(Egyptian.mp3); autoplay: true; loop: true" position="0 1 -3"></a-entity>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0" >
        <a-plane src="#card" position="0 0 0" height="2" width="2" rotation="0 0 0" color="red" material="transparent: true"material="transparent: true"></a-plane>
        <a-gltf-model rotation="0 0 0 " position="0 0 0.1" scale="5 5 5" src="#avatarModel" animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate">
      </a-entity>
    </a-scene>
    <script>
      const soundEntity = document.getElementById('mySoundEntity');
      soundEntity.addEventListener('loaded', function () {
         soundEntity.components.sound.playSound();
      });

      // Example of playing/pausing sound with a button (you'll need to add this button to your HTML)
       document.getElementById('playPauseButton').addEventListener('click', function() {
         if (soundEntity.components.sound.isPlaying) {
          soundEntity.components.sound.pauseSound();
        } else {
           soundEntity.components.sound.playSound();
         }
     });
    </script>
  </body>
</html>
